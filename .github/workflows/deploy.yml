name: deploy
on:
  push:
    branches: [main]
    # Only what goes into the backend bundle (buildspec artifact: Dockerfile, requirements.txt, backend/) starts the
    # pipeline. A frontend, docs or test change redeploys an identical backend, costs pipeline minutes and briefly
    # takes the single-instance API down for nothing. The frontend deploys through Vercel.
    paths: ["backend/**", "Dockerfile", "requirements.txt", "buildspec.yml"]
permissions:
  id-token: write
  contents: read
jobs:
  start-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::885232248320:role/github-actions-start-pipeline
          aws-region: us-east-1
      - run: aws codepipeline start-pipeline-execution --name role2-builder
