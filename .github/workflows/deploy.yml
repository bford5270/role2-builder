name: deploy
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
permissions:
  id-token: write
  contents: read
jobs:
  start-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::885232248320:role/github-actions-start-pipeline
          aws-region: us-east-1
      - run: aws codepipeline start-pipeline-execution --name role2-builder
